name: Tests

on:
  # 在推送和PR时运行测试
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # 允许手动触发
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3']

    name: PHP ${{ matrix.php-version }} Tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
        coverage: xdebug

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php-version }}-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-suggest

    - name: Run PHPUnit tests
      run: composer test

  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv

    - name: Cache Composer packages
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-8.1-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-8.1-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-suggest

    - name: Check PHP syntax
      run: find src tests -name "*.php" -exec php -l {} \; && php -l bin/pure

    - name: Run PHP CS Fixer
      run: composer cs-check

    - name: Run PHPStan
      run: composer phpstan

    - name: Smoke test the examples
      run: |
        php bin/pure compile --plain examples
        php bin/pure compile --check --plain examples
        for route in /cover /pure/features /plain/features /pure/pricing /plain/pricing; do
          if REQUEST_URI="$route" php examples/bootstrap/public/index.php | grep -q '<h1>404</h1>'; then
            echo "route $route fell back to the 404 page"
            exit 1
          fi
        done
        for route in /index.php /pure /plain; do
          if REQUEST_URI="$route" php examples/event-counter/public/index.php | grep -q '<h1>404</h1>'; then
            echo "route $route fell back to the 404 page"
            exit 1
          fi
        done
        php examples/event-counter/public/index.php | grep -q '<!DOCTYPE html>' || exit 1
        for route in /index.php /pure /plain; do
          if REQUEST_URI="$route" php examples/xml/public/index.php | grep -q '<routes '; then
            echo "route $route fell back to the 404 page"
            exit 1
          fi
        done
        php examples/xml/public/index.php | grep -q '<?xml' || exit 1
        REQUEST_URI=/pure php examples/xml/public/index.php | grep -q '<customers' || exit 1
        php examples/xml/write.php > /dev/null
        grep -q '<customers' examples/xml/example.xml
